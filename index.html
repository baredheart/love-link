<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bared Heart</title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: white;
            overflow-x: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            min-height: 100vh;
        }

        /* MOBILE ONLY */

        @media (max-width: 768px) {

            html,
            body {
                overflow-x: auto;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #canvas {
                width: auto;
                min-width: 100%;
                max-width: none;
            }
        }

    </style>

</head>

<body>

    <svg
        id="canvas"
        width="100%"
        height="100vh"
    ></svg>

    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./script.js"></script>

</body>

</html>
